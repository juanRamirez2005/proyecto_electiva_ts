<!DOCTYPE html>
<html lang="es">
  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesamiento de Pedidos</title>
    <link rel="stylesheet" href="../styles/recepcion.css" />
    <link rel="stylesheet" href="../styles/procesamiento-grid.css?v=100" />
    <link rel="icon" type="image/svg" href="../assets/icon.svg">
</head>

<body>
    <div class="page-container-full">
        <!-- Main -->
        <main class="main-full">
            <section>
                <nav class="navegation">
                    <a href="./home.html">Home</a>
                    <a href="./recepcion.html">Recepción</a>
                    <a href="./despacho.html">Despacho</a>
                    <a href="./horarios.html">Horarios</a>
                    <a href="./historial.html">Historial</a>
                    <a href="./empleados.html">Empleados</a>
                </nav>
                <div class="breadcrumbs">
                    <a href="./home.html">🏠 Inicio</a>
                    <span class="separator">›</span>
                    <span class="current">Procesamiento de Pedidos</span>
                </div>
            </section>

            <section>
                <a href="./inventario.html">
                    <button type="button" class="secundary">Inventario</button>
                </a>
                <div class="container-full" role="main">
                    <h1>Procesamiento de Pedidos</h1>
                    <p class="lead">
                        Asigna empleados para procesar los pedidos pendientes. Puedes seleccionar múltiples empleados por pedido.
                    </p>

                    <div id="procesamientoForm" novalidate>
                        <!-- CONTENEDOR DINÁMICO DE PEDIDOS -->
                        <div id="pedidos-container">
                            <!-- Los pedidos se cargarán aquí automáticamente desde localStorage -->
                        </div>

                        <!-- SECCIÓN ACCIONES -->
                        <section class="section acciones-full">
                            <div class="actions">
                                <div class="summary" id="resumenProcesamiento" aria-live="polite">
                                    Selecciona empleados para procesar los pedidos.
                                </div>
                                <div style="display: flex; gap: 8px; margin-left: 12px">
                                    <button type="button" class="ghost" onclick="window.procesamientoPedidos.limpiarFormulario()">Limpiar Todo</button>
                                    <button type="submit" class="primary" id="btnConfirmarProcesamiento">Confirmar Procesamiento</button>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/procesamiento/procesamiento.js?v=99" type="module"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/autoreload.js"></script>
</body>

</html>
